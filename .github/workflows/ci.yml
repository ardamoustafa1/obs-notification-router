name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: router
          POSTGRES_USER: router
          POSTGRES_PASSWORD: router
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U router" --health-interval 2s
          --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
        env:
          TEST_DATABASE_URL: postgres://router:router@localhost:5432/router?sslmode=disable
      - run: go build ./cmd/router

