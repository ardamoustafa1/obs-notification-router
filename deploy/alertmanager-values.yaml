alertmanager:
  alertmanagerSpec:
    replicas: 3
    secrets:
      - notification-router-webhook
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: notification-router-default
      group_by: [cluster, environment, team, service, alertname]
      group_wait: 15s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: notification-router-page
          matchers:
            - 'severity = "page"'
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 15m
        - receiver: notification-router-default
          matchers:
            - 'severity =~ "info|warning"'
    receivers:
      - name: notification-router-default
        webhook_configs:
          - url: http://obs-notification-router.observability.svc.cluster.local:8080/v1/webhooks/alertmanager
            send_resolved: true
            max_alerts: 100
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/notification-router-webhook/token
      - name: notification-router-page
        webhook_configs:
          - url: http://obs-notification-router.observability.svc.cluster.local:8080/v1/webhooks/alertmanager
            send_resolved: true
            max_alerts: 100
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/notification-router-webhook/token
    inhibit_rules:
      - source_matchers: ['severity = "page"']
        target_matchers: ['severity =~ "warning|info"']
        equal: [cluster, environment, team, service, alertname]
      - source_matchers: ['severity = "warning"']
        target_matchers: ['severity = "info"']
        equal: [cluster, environment, team, service, alertname]

