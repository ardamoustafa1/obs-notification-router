apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "obs-notification-router.fullname" . }}
  labels: {{- include "obs-notification-router.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "obs-notification-router.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "obs-notification-router.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "obs-notification-router.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: router
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "obs-notification-router.fullname" . }}
  labels: {{- include "obs-notification-router.labels" . | nindent 4 }}
spec:
  selector: {{- include "obs-notification-router.labels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
